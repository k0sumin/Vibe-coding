<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장 (보안 실습용 - 수정 완료)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #ffd3e0;
      --pink-deep: #ff8fab;
      --mint: #c8f4de;
      --lavender: #e3d9fb;
      --ink: #4a3f4d;
      --ink-muted: #9a8ea0;
      --border: #f0e4ee;
      --bg: #fdf6fa;
      --danger: #ff5c7a;
    }

    body {
      font-family: "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, var(--bg), #f3ecfb 60%, #eafaf1);
      min-height: 100vh;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    .title {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .title h1 {
      font-size: 1.6rem;
      font-weight: 900;
    }

    .title p {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .warning-banner {
      background: #f2fbf6;
      border: 1.5px solid var(--mint);
      color: #2f8f63;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(255, 143, 171, 0.12);
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .form-row input,
    .form-row textarea {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-row input:focus,
    .form-row textarea:focus {
      border-color: var(--pink-deep);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin-top: 0.5rem;
    }

    .btn {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--pink-deep), #ffb3c6);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 143, 171, 0.35);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 0.6rem;
      display: none;
    }

    #setup-screen,
    #lock-screen,
    #memo-screen {
      display: none;
    }

    #memo-list {
      list-style: none;
    }

    #memo-list li {
      padding: 0.9rem 0.1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      word-break: break-word;
    }

    #memo-list li:last-child {
      border-bottom: none;
    }

    .empty-msg {
      text-align: center;
      padding: 1.5rem 0;
      color: var(--ink-muted);
      font-size: 0.88rem;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">
      <h1>🔒 비밀 메모장</h1>
      <p>보안 수업 실습용 페이지 (취약점 3가지 수정 완료)</p>
    </div>

    <div class="warning-banner">
      ✅ 하드코딩 비밀번호 / innerHTML XSS / console.log 노출 3가지를 수정했습니다.
      다만 여전히 서버 없는 정적 페이지라 비밀번호는 이 브라우저의 localStorage에만 저장되며,
      진짜 민감한 정보는 넣지 마세요.
    </div>

    <!-- 최초 실행 시: 비밀번호 설정 화면 -->
    <div class="card" id="setup-screen">
      <p class="hint" style="margin-top: 0; margin-bottom: 0.9rem;">처음 사용하시네요. 사용할 비밀번호를 직접 설정해 주세요.</p>
      <div class="form-row">
        <input type="password" id="new-password-input" placeholder="새 비밀번호 (4자 이상)">
        <input type="password" id="confirm-password-input" placeholder="비밀번호 확인">
      </div>
      <button class="btn" type="button" id="setup-btn">비밀번호 설정하기</button>
      <p class="error-msg" id="setup-error"></p>
    </div>

    <!-- 이후 실행 시: 잠금 화면 -->
    <div class="card" id="lock-screen">
      <div class="form-row">
        <input type="password" id="password-input" placeholder="비밀번호를 입력하세요">
      </div>
      <button class="btn" type="button" id="unlock-btn">잠금 해제</button>
      <p class="error-msg" id="lock-error">비밀번호가 올바르지 않습니다.</p>
    </div>

    <!-- 메모 화면 -->
    <div id="memo-screen">
      <div class="card">
        <div class="form-row">
          <textarea id="memo-input" rows="3" placeholder="메모를 입력하세요"></textarea>
        </div>
        <button class="btn" type="button" id="add-memo-btn">메모 추가</button>
      </div>

      <div class="card">
        <ul id="memo-list"></ul>
        <p class="empty-msg" id="empty-msg">아직 작성된 메모가 없어요</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 보안 수업 실습용 페이지 — 이전 버전에서 발견된 취약점 3가지를 수정한 버전.
    // ① 비밀번호 하드코딩 → 최초 실행 시 사용자가 직접 설정 + SHA-256 해시로 저장
    // ② innerHTML XSS → 메모 표시 전 HTML 특수문자 이스케이프
    // ③ console.log 노출 → 비밀번호/판정 결과를 로그로 남기지 않음
    // ============================================================

    const STORAGE_KEY = 'secretMemoPasswordHash';

    const setupScreen = document.getElementById('setup-screen');
    const lockScreen = document.getElementById('lock-screen');
    const memoScreen = document.getElementById('memo-screen');

    function showScreen(screen) {
      setupScreen.style.display = 'none';
      lockScreen.style.display = 'none';
      memoScreen.style.display = 'none';
      screen.style.display = 'block';
    }

    // ✅ 수정 1: 비밀번호를 코드에 저장하지 않고, 입력값을 SHA-256으로 해시해서만 비교/저장
    // (여전히 서버가 없는 정적 페이지이므로 완벽한 인증은 아니지만, 최소한 평문 노출은 막음)
    async function sha256Hex(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((byte) => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    // 최초 실행 여부에 따라 설정 화면 / 잠금 화면 분기
    if (localStorage.getItem(STORAGE_KEY)) {
      showScreen(lockScreen);
    } else {
      showScreen(setupScreen);
    }

    // ----- 최초 비밀번호 설정 -----
    const newPasswordInput = document.getElementById('new-password-input');
    const confirmPasswordInput = document.getElementById('confirm-password-input');
    const setupBtn = document.getElementById('setup-btn');
    const setupError = document.getElementById('setup-error');

    async function setupPassword() {
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 4) {
        setupError.textContent = '비밀번호는 4자 이상으로 설정해 주세요.';
        setupError.style.display = 'block';
        return;
      }
      if (newPassword !== confirmPassword) {
        setupError.textContent = '비밀번호가 서로 일치하지 않습니다.';
        setupError.style.display = 'block';
        return;
      }

      const hash = await sha256Hex(newPassword);
      localStorage.setItem(STORAGE_KEY, hash);
      newPasswordInput.value = '';
      confirmPasswordInput.value = '';
      showScreen(memoScreen);
    }

    setupBtn.addEventListener('click', setupPassword);
    confirmPasswordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setupPassword();
    });

    // ----- 잠금 해제 -----
    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockError = document.getElementById('lock-error');

    async function checkPassword() {
      const storedHash = localStorage.getItem(STORAGE_KEY);
      const inputHash = await sha256Hex(passwordInput.value);

      if (inputHash === storedHash) {
        passwordInput.value = '';
        lockError.style.display = 'none';
        showScreen(memoScreen);
      } else {
        lockError.style.display = 'block';
      }
    }

    unlockBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // ----- 메모 -----
    const memoInput = document.getElementById('memo-input');
    const addMemoBtn = document.getElementById('add-memo-btn');
    const memoList = document.getElementById('memo-list');
    const emptyMsg = document.getElementById('empty-msg');

    // ✅ 수정 2: HTML 특수문자를 이스케이프해서 사용자 입력이 태그/속성으로 해석되지 않도록 함
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function addMemo() {
      const text = memoInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.innerHTML = escapeHtml(text);

      memoList.appendChild(li);
      emptyMsg.style.display = 'none';
      memoInput.value = '';
      memoInput.focus();
    }

    addMemoBtn.addEventListener('click', addMemo);
    memoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addMemo();
      }
    });
  </script>
</body>

</html>
