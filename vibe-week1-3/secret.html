<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장 (보안 실습용 - 취약점 포함)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #ffd3e0;
      --pink-deep: #ff8fab;
      --mint: #c8f4de;
      --lavender: #e3d9fb;
      --ink: #4a3f4d;
      --ink-muted: #9a8ea0;
      --border: #f0e4ee;
      --bg: #fdf6fa;
      --danger: #ff5c7a;
    }

    body {
      font-family: "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, var(--bg), #f3ecfb 60%, #eafaf1);
      min-height: 100vh;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    .title {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .title h1 {
      font-size: 1.6rem;
      font-weight: 900;
    }

    .title p {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .warning-banner {
      background: #fff3f3;
      border: 1.5px solid var(--danger);
      color: #c0293c;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(255, 143, 171, 0.12);
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: flex;
      gap: 0.6rem;
    }

    .form-row input,
    .form-row textarea {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-row input:focus,
    .form-row textarea:focus {
      border-color: var(--pink-deep);
    }

    .btn {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--pink-deep), #ffb3c6);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 143, 171, 0.35);
    }

    #lock-error {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 0.6rem;
      display: none;
    }

    #memo-screen {
      display: none;
    }

    #memo-list {
      list-style: none;
    }

    #memo-list li {
      padding: 0.9rem 0.1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      word-break: break-word;
    }

    #memo-list li:last-child {
      border-bottom: none;
    }

    .empty-msg {
      text-align: center;
      padding: 1.5rem 0;
      color: var(--ink-muted);
      font-size: 0.88rem;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">
      <h1>🔒 비밀 메모장</h1>
      <p>보안 수업 실습용 페이지 (일부러 취약하게 구현됨)</p>
    </div>

    <div class="warning-banner">
      ⚠️ 이 페이지는 <strong>보안 실습 전용</strong>입니다. 의도적으로 취약점 3가지를 포함하고 있으며,
      실제 서비스에는 절대 사용하면 안 됩니다. 로컬에서만 열어보고, 개인정보나 실제 비밀번호를 입력하지 마세요.
    </div>

    <!-- 잠금 화면 -->
    <div class="card" id="lock-screen">
      <div class="form-row">
        <input type="password" id="password-input" placeholder="비밀번호를 입력하세요">
      </div>
      <button class="btn" type="button" id="unlock-btn">잠금 해제</button>
      <p id="lock-error">비밀번호가 올바르지 않습니다.</p>
    </div>

    <!-- 메모 화면 -->
    <div id="memo-screen">
      <div class="card">
        <div class="form-row">
          <textarea id="memo-input" rows="3" placeholder="메모를 입력하세요"></textarea>
        </div>
        <button class="btn" type="button" id="add-memo-btn">메모 추가</button>
      </div>

      <div class="card">
        <ul id="memo-list"></ul>
        <p class="empty-msg" id="empty-msg">아직 작성된 메모가 없어요</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // ⚠️ 이 파일은 보안 수업 실습용으로, 아래 3가지 취약점을 "의도적으로" 포함합니다.
    // 실습 목표: 아래 표시된 취약점을 스스로 찾아 안전한 방식으로 고치기.
    // ============================================================

    // ⚠️ 취약점 1: 비밀번호를 코드에 하드코딩 (누구나 소스 보기로 확인 가능)
    // → 실제 서비스라면 서버 측 인증, 해시된 비밀번호 저장 등으로 대체해야 함
    const HARDCODED_PASSWORD = '1234';

    const passwordInput = document.getElementById('password-input');
    const unlockBtn = document.getElementById('unlock-btn');
    const lockError = document.getElementById('lock-error');
    const lockScreen = document.getElementById('lock-screen');
    const memoScreen = document.getElementById('memo-screen');

    function checkPassword() {
      const isCorrect = passwordInput.value === HARDCODED_PASSWORD;

      // ⚠️ 취약점 3: 비밀번호 확인 결과(및 입력값)를 콘솔에 그대로 출력
      // → 브라우저 개발자 도구(F12)만 열면 누구나 확인 가능. 민감한 정보는 로그로 남기면 안 됨
      console.log('비밀번호 확인 결과:', isCorrect, '입력값:', passwordInput.value);

      if (isCorrect) {
        lockScreen.style.display = 'none';
        memoScreen.style.display = 'block';
        lockError.style.display = 'none';
      } else {
        lockError.style.display = 'block';
      }
    }

    unlockBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    const memoInput = document.getElementById('memo-input');
    const addMemoBtn = document.getElementById('add-memo-btn');
    const memoList = document.getElementById('memo-list');
    const emptyMsg = document.getElementById('empty-msg');

    function addMemo() {
      const text = memoInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');

      // ⚠️ 취약점 2: 사용자 입력을 이스케이프 없이 innerHTML로 그대로 삽입 (XSS)
      // → 예: <img src=x onerror="alert(1)"> 같은 값을 메모에 입력하면 스크립트가 그대로 실행됨
      // → 안전하게 하려면 textContent를 쓰거나, HTML 특수문자를 이스케이프해야 함
      li.innerHTML = text;

      memoList.appendChild(li);
      emptyMsg.style.display = 'none';
      memoInput.value = '';
      memoInput.focus();
    }

    addMemoBtn.addEventListener('click', addMemo);
    memoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addMemo();
      }
    });
  </script>
</body>

</html>
